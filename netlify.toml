[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/commercial-direction"
  to = "/founders/"
  status = 301
  force = true

[[redirects]]
  from = "/commercial-direction/"
  to = "/founders/"
  status = 301
  force = true

[[redirects]]
  from = "/operating-partner"
  to = "/founders/"
  status = 301
  force = true

[[redirects]]
  from = "/operating-partner/"
  to = "/founders/"
  status = 301
  force = true

[[redirects]]
  from = "/api/crm/contacts/*"
  to = "/.netlify/functions/crm-contacts/:splat"
  status = 200

[[redirects]]
  from = "/api/crm/contacts"
  to = "/.netlify/functions/crm-contacts"
  status = 200

[[redirects]]
  from = "/api/crm/companies/*"
  to = "/.netlify/functions/crm-companies/:splat"
  status = 200

[[redirects]]
  from = "/api/crm/companies"
  to = "/.netlify/functions/crm-companies"
  status = 200

[[redirects]]
  from = "/api/crm/deals/*"
  to = "/.netlify/functions/crm-deals/:splat"
  status = 200

[[redirects]]
  from = "/api/crm/deals"
  to = "/.netlify/functions/crm-deals"
  status = 200
